name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev qt6-wayland libqt6svg6 qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtqml qml6-module-qtqml-models desktop-file-utils
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - run: python3 tests/release_metadata.py
      - run: python3 tests/packaging.py
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: desktop-file-validate packaging/io.github.tcballard.TaskManager.desktop
      - run: python3 tests/protocol.py build/omarchy-task-manager-core
      - run: QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software build/omarchy-task-manager --smoke
      - run: ctest --test-dir build --output-on-failure
      - name: Repeat live worker pause/resume regression
        run: ctest --test-dir build -R "^bridge$" --repeat until-fail:20 --output-on-failure
      - name: Real systemd service controls
        run: |
          service_fixture=$(mktemp -d)
          chmod 755 "$service_fixture"
          install -m755 build/omarchy-task-manager-core "$service_fixture/core"
          install -m644 tests/live_services.py "$service_fixture/live_services.py"
          sudo env GITHUB_ACTIONS=true python3 "$service_fixture/live_services.py" "$service_fixture/core" --scope system
          service_user=task-manager-ci
          sudo useradd --create-home "$service_user"
          service_uid=$(id -u "$service_user")
          cleanup() {
            sudo loginctl disable-linger "$service_user" || true
            sudo loginctl terminate-user "$service_user" || true
            sudo userdel --remove "$service_user" || true
          }
          trap cleanup EXIT
          sudo loginctl enable-linger "$service_user"
          sudo systemctl start "user@$service_uid.service"
          sudo -u "$service_user" env XDG_RUNTIME_DIR="/run/user/$service_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$service_uid/bus" python3 "$service_fixture/live_services.py" "$service_fixture/core" --scope user
      - name: Installed application smoke
        run: |
          DESTDIR="$RUNNER_TEMP/task-manager-stage" cmake --install build --prefix /usr
          smoke_root=$(mktemp -d)
          XDG_CONFIG_HOME="$smoke_root/config" XDG_STATE_HOME="$smoke_root/state" XDG_RUNTIME_DIR="$smoke_root" QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 20s "$RUNNER_TEMP/task-manager-stage/usr/bin/omarchy-task-manager" --smoke
  arch-package:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git nodejs cmake ninja rust cargo qt6-base qt6-declarative qt6-wayland qt6-svg python desktop-file-utils namcap
      - uses: actions/checkout@v4
      - run: |
          ./scripts/package-source.sh
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c 'cd "$1/dist" && makepkg --noconfirm' _ "$GITHUB_WORKSPACE"
      - name: Repeat Arch live worker pause/resume regression
        run: runuser -u builder -- ctest --test-dir dist/src/build -R "^bridge$" --repeat until-fail:20 --output-on-failure
      - name: Inspect recipe and package
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/omarchy-task-manager-[0-9]*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          namcap dist/PKGBUILD "${packages[0]}" | tee dist/namcap.txt
          if grep -E ' E: ' dist/namcap.txt; then exit 1; fi
          bsdtar -tf "${packages[0]}" > dist/package-files.txt
          if grep -Ev '^(\.[A-Z]+|usr(/.*)?)/?$' dist/package-files.txt; then exit 1; fi
          for path in usr/bin/omarchy-task-manager usr/lib/omarchy-task-manager/omarchy-task-manager-core usr/share/applications/io.github.tcballard.TaskManager.desktop usr/share/licenses/omarchy-task-manager/LICENSE; do
            grep -Fx "$path" dist/package-files.txt
          done
      - name: Fresh install, upgrade from v0.0.2, reinstall and remove
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/omarchy-task-manager-[0-9]*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          smoke() {
            runuser -u builder -- bash -c 'smoke_root=$(mktemp -d); XDG_CONFIG_HOME="$smoke_root/config" XDG_STATE_HOME="$smoke_root/state" XDG_RUNTIME_DIR="$smoke_root" QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 20s /usr/bin/omarchy-task-manager --smoke'
          }
          pacman -U --noconfirm "${packages[0]}"
          pacman -Qk omarchy-task-manager
          smoke
          pacman -R --noconfirm omarchy-task-manager
          previous=$(mktemp -d)
          base=https://github.com/tcballard/omarchy-task-manager/releases/download/v0.0.2
          curl -fL "$base/omarchy-task-manager-0.0.2-1-x86_64.pkg.tar.zst" -o "$previous/omarchy-task-manager-0.0.2-1-x86_64.pkg.tar.zst"
          curl -fL "$base/SHA256SUMS" -o "$previous/SHA256SUMS"
          (cd "$previous" && sha256sum --ignore-missing --check SHA256SUMS)
          pacman -U --noconfirm "$previous/omarchy-task-manager-0.0.2-1-x86_64.pkg.tar.zst"
          runuser -u builder -- bash -c 'mkdir -p ~/.config/tcballard ~/.local/state/omarchy-task-manager; printf "[General]\npackagingTest=keep\n" > ~/.config/tcballard/omarchy-task-manager.conf; printf "{\"rows\":[],\"since\":1}\n" > ~/.local/state/omarchy-task-manager/history.json'
          preserved=$(mktemp)
          sha256sum /home/builder/.config/tcballard/omarchy-task-manager.conf /home/builder/.local/state/omarchy-task-manager/history.json > "$preserved"
          pacman -U --noconfirm "${packages[0]}"
          pacman -Qk omarchy-task-manager
          pacman -U --noconfirm "${packages[0]}"
          sha256sum --check "$preserved"
          smoke
          pacman -R --noconfirm omarchy-task-manager
          sha256sum --check "$preserved"
          test ! -e /usr/bin/omarchy-task-manager
          test ! -e /usr/lib/omarchy-task-manager/omarchy-task-manager-core
          test ! -e /usr/share/applications/io.github.tcballard.TaskManager.desktop
      - name: Checksum release assets
        shell: bash
        run: |
          printf 'Commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD-INFO.txt
          cd dist
          sha256sum omarchy-task-manager-*.pkg.tar.zst omarchy-task-manager-*.tar.gz PKGBUILD BUILD-INFO.txt namcap.txt package-files.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: arch-development-package
          if-no-files-found: error
          path: |
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/PKGBUILD
            dist/BUILD-INFO.txt
            dist/SHA256SUMS
            dist/namcap.txt
            dist/package-files.txt
  release:
    name: Publish v0.0.3 preview
    needs: [linux, arch-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'tcballard/omarchy-task-manager'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-v0.0.3
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$version" = "0.0.3" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: arch-development-package
          path: release-assets
      - name: Publish tested assets
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == "v0.0.3") | .html_url')
          if [ -n "$existing" ]; then
            echo "Updating v0.0.3 release notes: $existing"
            gh release edit v0.0.3 --notes-file RELEASE_NOTES.md
            exit 0
          fi
          tags=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v0.0.3" --jq '.[] | select(.ref == "refs/tags/v0.0.3") | .object.sha')
          if [ -n "$tags" ]; then
            echo "Refusing to reuse an existing v0.0.3 tag without a release"
            exit 1
          fi
          (cd release-assets && sha256sum --check SHA256SUMS)
          grep -Fx "Commit: $GITHUB_SHA" release-assets/BUILD-INFO.txt
          gh release create v0.0.3 release-assets/* --target "$GITHUB_SHA" --draft --prerelease --title "v0.0.3 — Ready for repository packaging" --notes-file RELEASE_NOTES.md
          gh release edit v0.0.3 --draft=false
